# Checks every push and pull request: typecheck, tests, a production build, and the dependency audit.
# It needs no secrets and no database. See "Continuous checks" in README.md and item 1 of docs/security-audit.md.
#
# Actions are pinned to a full commit SHA (a tag can be moved; a SHA cannot). Dependabot keeps them current,
# see .github/dependabot.yml.

name: CI

on:
  push:
  pull_request:
  # Once a week even when nobody pushes, so a new advisory against a dependency is found without anyone looking.
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

# The workflow only reads the code.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # RouteContext and the other route types are generated by Next.js, so tsc needs them written first.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      # The build connects to no database (pages that read it are rendered on request), so DATABASE_URL is
      # left unset on purpose. SESSION_SECRET must exist because lib/session-options.ts throws without it;
      # this value is a throwaway that signs nothing real.
      - name: Build
        run: npm run build
        env:
          SESSION_SECRET: ci-throwaway-secret-not-used-anywhere-0123456789

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Only what ships to the server (--omit=dev), and only high or critical advisories fail the run.
      # Moderate ones are still printed in the log. Reads package-lock.json, so no install is needed.
      - name: npm audit
        run: npm audit --omit=dev --audit-level=high
