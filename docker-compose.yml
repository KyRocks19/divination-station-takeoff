# Starts the full local edition: `docker compose up --build`, then open http://localhost:47831 (docs/local-edition-setup.md).
# The port is published on this computer's loopback address only, so nothing else on the network can reach the app.
services:
  divination-station:
    build: .
    image: divination-station:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:47831:47831"
    volumes:
      - ds-data:/data
    environment:
      # Optional. Uncomment to use them; never write a key into a file that is shared or committed.
      # ANTHROPIC_API_KEY: ""
      # IMAGE_GEN_URL: "http://host.docker.internal:5001"
      # Host mode (docs/host-guide.md): serve your circle through Tailscale or Headscale on this computer. You will be able to read what they write.
      # DS_MODE: host
      # ALLOWED_HOSTS: "my-pc.tail1234.ts.net"
      # DS_HOST_CIRCLE_MAX: "10"
      DS_EDITION: local
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  ds-data:
